# LAND box mic processing: WebRTC echo cancel + noise suppression + automatic gain, in PipeWire.
# Installed to ~/.config/pipewire/pipewire.conf.d/ by deploy/pi/install.sh, then "land_mic" and "land_speaker"
# become the default source and sink, so every service (voice check-in, mic test, scream, live call) gets:
#   - echo cancel: the box's own speaker (its voice, a caller on the live call) is removed from the mics
#   - noise suppression: steady noise (fans, traffic, rumble) pushed down
#   - gain control: a quiet voice is raised to a clear level
#   - high-pass filter: low rumble removed
# The hardware nodes are the I2S card (googlevoicehat overlay), named by PipeWire as below.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      node.latency = 1024/48000
      monitor.mode = false
      audio.channels = 2
      audio.position = [ FL FR ]
      aec.args = {
        webrtc.high_pass_filter = true
        webrtc.noise_suppression = true
        webrtc.gain_control = true
        webrtc.voice_detection = true
      }
      capture.props = {
        node.name = "land_capture"
        target.object = "alsa_input.platform-soc_107c000000_sound.stereo-fallback"
        node.passive = true
      }
      source.props = {
        node.name = "land_mic"
        node.description = "LAND mic (echo cancel, noise suppression, gain)"
      }
      sink.props = {
        node.name = "land_speaker"
        node.description = "LAND speaker (echo-cancel reference)"
      }
      playback.props = {
        node.name = "land_playback"
        target.object = "alsa_output.platform-soc_107c000000_sound.stereo-fallback"
        node.passive = true
      }
    }
  }
]
