<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HackUTD status</title>
<style>
:root{
  --bg:#fff; --fg:#171717; --muted:#737373; --faint:#a3a3a3; --line:#ececec; --soft:#fafafa;
  --blue:#2563eb; --amber:#d97706; --red:#dc2626; --violet:#7c3aed; --green:#16a34a; --gray:#b5b5b5;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
code,pre{font-family:var(--mono);font-size:12px}
pre{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;word-break:break-all}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;font-weight:600;margin:0}
.meta{color:var(--muted);font-size:12px}
.meta.bad{color:var(--red)}
section{padding:18px 0;border-bottom:1px solid var(--line)}
h2{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
h2 button{margin-left:auto}
button{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
button:hover{color:var(--fg);border-color:#d4d4d4}
.row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-of-type{border-top:0}
.row .body{flex:1;min-width:0}
.row .side{color:var(--muted);font-size:12px;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:7px;background:var(--gray)}
/* Needs you */
.task input{margin:3px 0 0;accent-color:var(--fg);width:15px;height:15px;flex:none}
.task.done .title{color:var(--faint);text-decoration:line-through}
.task.done .sub,.task.done details{display:none}
.title{font-weight:500}
.due{color:var(--amber);font-size:12px;font-weight:500}
.due.late{color:var(--red)}
details{margin-top:2px;font-size:12.5px;color:var(--muted)}
summary{cursor:pointer;width:fit-content}
details ol{margin:4px 0;padding-left:18px}
.cmd{display:flex;gap:6px;align-items:flex-start}
.cmd pre{flex:1;margin:4px 0}
.cmd button{margin-top:6px}
.empty{color:var(--faint);font-size:13px;padding:4px 0}
/* Countdowns */
.clocks{display:grid;grid-template-columns:repeat(5,1fr)}
.clock{padding:2px 12px;border-left:1px solid var(--line)}
.clock:first-child{border-left:0;padding-left:0}
.clock .lbl{font-size:12px;color:var(--muted)}
.clock .left{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .at{font-size:12px;color:var(--faint)}
.clock.soon .left{color:var(--amber)}
.clock.past .left{color:var(--faint);font-weight:500}
/* Build map */
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.map{display:grid;grid-template-columns:1fr 56px minmax(0,1.05fr) 56px 1fr;align-items:center}
.col .who{font-size:11px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px 2px}
.wire{height:100%;position:relative}
.wire::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #d4d4d4}
.wire::after{content:"";position:absolute;right:0;top:calc(50% - 3px);border:3px solid transparent;border-left:5px solid #c4c4c4;border-right:0}
.wire.in::after{left:0;right:auto;border-left:0;border-right:5px solid #c4c4c4}
.node{display:block;border:1px solid var(--line);border-left:3px solid var(--c,var(--gray));border-radius:6px;padding:7px 10px;margin:0 0 8px;background:var(--bg)}
.node:hover{text-decoration:none;border-color:#d4d4d4;border-left-color:var(--c,var(--gray))}
.node .t{font-weight:500;font-size:13px;line-height:1.35}
.node .t b{color:var(--muted);font-weight:500;margin-right:4px}
.node .s{font-size:12px;color:var(--muted);margin-top:2px}
.node .s .st{color:var(--c);font-weight:500}
.node .n{font-size:12px;color:var(--muted);margin-top:3px}
.node.hub{padding:12px 14px;margin:0}
.node.hub .t{font-size:14.5px}
.st-not-started{--c:var(--gray)} .st-working{--c:var(--blue)} .st-blocked{--c:var(--red)} .st-pr{--c:var(--violet)} .st-merged{--c:var(--green)}
/* Feed */
.feed .row.new{background:linear-gradient(90deg,#eff6ff,transparent 70%);box-shadow:inset 2px 0 0 var(--blue);padding-left:8px;margin-left:-8px}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;white-space:nowrap}
.k-commit .dot{background:var(--green)} .k-comment .dot{background:var(--blue)} .k-issue .dot{background:var(--gray)}
.k-pr .dot{background:var(--violet)} .k-thread .dot{background:var(--amber)} .k-push .dot{background:var(--green)}
.newmark{color:var(--blue);font-size:11px;font-weight:600;margin-left:6px}
.more{margin-top:8px}
.errors{color:var(--red);font-size:12px}
@media (max-width:720px){
  .clocks{grid-template-columns:1fr 1fr}
  .clock{border-left:0;padding:6px 0;border-top:1px solid var(--line)}
  .clock:nth-child(-n+2){border-top:0}
  .map{grid-template-columns:1fr}
  .wire{display:none}
  .node.hub{margin:4px 0 16px}
  .col.hw{order:-1}
  .row .side{display:none}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>HackUTD 26 status</h1>
    <span class="meta" id="fresh">Loading</span>
    <span class="meta" id="next"></span>
  </header>

  <section id="needs">
    <h2>Needs you <span class="count" id="needs-count"></span></h2>
    <div id="tasks"></div>
    <div id="pushes"></div>
    <div id="owner-threads"></div>
  </section>

  <section>
    <h2>Countdowns</h2>
    <div class="clocks" id="clocks"></div>
  </section>

  <section>
    <h2>Build map</h2>
    <div class="legend">
      <span><i style="background:var(--gray)"></i>Not started</span>
      <span><i style="background:var(--blue)"></i>Working</span>
      <span><i style="background:var(--red)"></i>Blocked</span>
      <span><i style="background:var(--violet)"></i>PR open</span>
      <span><i style="background:var(--green)"></i>Merged</span>
    </div>
    <div class="map" id="map"></div>
  </section>

  <section class="feed">
    <h2>What changed <span class="count" id="new-count"></span><button id="seen">Mark all seen</button></h2>
    <div id="feed"></div>
    <button class="more" id="feed-more">Show more</button>
  </section>

  <section class="feed">
    <h2>Rafael</h2>
    <div id="rafael"></div>
  </section>

  <p class="errors" id="errors"></p>
</main>

<script>
const TZ = "America/Chicago";
const TASKS = [
  {id:"nvidia-form", title:"NVIDIA feedback form", due:"2026-11-07T19:00:00-06:00",
   sub:'<a href="https://forms.gle/ruwZj6LSDmwxuVGT7" target="_blank">Open the form</a>. Paste the answers from the thread. Add your building and room.'},
  {id:"nvidia-key", title:"NVIDIA API key and smoke test",
   sub:'<a href="https://build.nvidia.com" target="_blank">build.nvidia.com</a>, search nemotron-3-nano-30b-a3b, Get API Key. It shows once. Tell Rafael to make his own.',
   more:`<details><summary>Smoke test</summary><ol><li>In a terminal: <code>export NVIDIA_API_KEY=nvapi-...</code></li><li>Run this. It should return a <code>tool_calls</code> entry.</li></ol>
<div class="cmd"><pre>curl -s https://integrate.api.nvidia.com/v1/chat/completions -H "Authorization: Bearer $NVIDIA_API_KEY" -H "Content-Type: application/json" -d '{"model":"nvidia/nemotron-3-nano-30b-a3b","messages":[{"role":"user","content":"Check the radar."}],"tools":[{"type":"function","function":{"name":"get_presence","description":"Read the radar","parameters":{"type":"object","properties":{}}}}],"tool_choice":"auto"}'</pre><button data-copy>Copy</button></div></details>`},
  {id:"elevenlabs", title:"ElevenLabs API key",
   sub:'<a href="https://elevenlabs.io/app/sign-up" target="_blank">Sign up</a>, then Developers, API Keys, Create. Paste it only into a secret card.'},
  {id:"twilio", title:"Twilio trial, verify Rafael's phone",
   sub:'<a href="https://www.twilio.com/try-twilio" target="_blank">Sign up</a>, get a phone number, then Phone Numbers, Manage, Verified Caller IDs, Add. Rafael reads you the code.'},
  {id:"devpost", title:"Devpost draft, add Rafael", due:"2026-11-07T23:00:00-06:00",
   sub:'<a href="https://hackutd-zeroday.devpost.com/" target="_blank">Join the hackathon</a>, start a project draft, add Rafael as a teammate, save.'},
];
const CLOCKS = [
  {lbl:"NVIDIA form", at:"2026-11-07T19:00:00-06:00"},
  {lbl:"ScrabbleBot tournament", at:"2026-11-07T22:45:00-06:00"},
  {lbl:"Devpost registration", at:"2026-11-07T23:00:00-06:00"},
  {lbl:"Submissions close", at:"2026-11-08T12:00:00-06:00"},
  {lbl:"Judging", at:"2026-11-08T13:00:00-06:00"},
];
const HARDWARE = [18, 11, 12, 13], SOFTWARE = [15, 14, 16, 20], HUB = 19;
const STATE_LABEL = {"not-started":"Not started", working:"Working", blocked:"Blocked", pr:"PR open", merged:"Merged"};
const FEED_STEP = 25;

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let data = null, feedShown = FEED_STEP;
let baseline = store.get("lastSeen", 0);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ms = iso => iso ? new Date(iso).getTime() : 0;
const clock = iso => new Date(iso).toLocaleTimeString("en-US", {timeZone:TZ, hour:"numeric", minute:"2-digit"});
const day = iso => new Date(iso).toLocaleDateString("en-US", {timeZone:TZ, weekday:"short"});
function ago(iso){
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - ms(iso)) / 1000);
  if (s < 45) return "just now";
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h} h ${m % 60} min ago` : `${Math.floor(h / 24)} d ago`;
}
function left(iso){
  const s = (ms(iso) - Date.now()) / 1000;
  if (s <= 0) return null;
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return h ? `${h}h ${String(m).padStart(2,"0")}m` : `${m}m ${String(sec).padStart(2,"0")}s`;
}
const shortTitle = t => String(t).replace(/^Box demo:\s*/i, "").replace(/\s*\(.*\)\s*$/, "").replace(/^./, c => c.toUpperCase());

function renderTasks(){
  const done = store.get("tasks", {});
  const ordered = [...TASKS].sort((a, b) => !!done[a.id] - !!done[b.id]);
  $("tasks").innerHTML = ordered.map(t => {
    const due = t.due ? `<span class="due" data-due="${t.due}"></span>` : "";
    return `<div class="row task ${done[t.id] ? "done" : ""}">
      <input type="checkbox" data-task="${t.id}" ${done[t.id] ? "checked" : ""} aria-label="${esc(t.title)}">
      <div class="body"><span class="title">${esc(t.title)}</span> ${done[t.id] ? "" : due}
        <div class="sub">${t.sub}</div>${t.more || ""}</div></div>`;
  }).join("");
  tickDue();
  return TASKS.filter(t => !done[t.id]).length;
}
function tickDue(){
  document.querySelectorAll("[data-due]").forEach(el => {
    const at = el.dataset.due, l = left(at);
    el.textContent = l ? `due ${clock(at)}, ${l} left` : `was due ${clock(at)}`;
    el.classList.toggle("late", !l);
  });
}

function renderNeeds(){
  let open = renderTasks();
  const pushes = data ? data.unpushed : [];
  const behind = data ? data.main.behind : 0;
  let html = pushes.map(p => `<div class="row"><span class="dot" style="background:var(--violet)"></span><div class="body">
      <span class="title">Push ${esc(p.branch)}</span> <span class="sub">${p.count} commit${p.count > 1 ? "s" : ""} not on GitHub, newest: ${esc(p.commits[0].subject)}</span>
      <div class="cmd"><pre>${esc(p.push)}</pre><button data-copy>Copy</button></div></div></div>`).join("");
  if (behind) html += `<div class="row"><span class="dot"></span><div class="body"><span class="title">Your main is ${behind} commit${behind > 1 ? "s" : ""} behind GitHub</span> <span class="sub">Pull when you are not mid-edit.</span>
      <div class="cmd"><pre>git -C ~/Developer/hackutd-26 pull --ff-only</pre><button data-copy>Copy</button></div></div></div>`;
  $("pushes").innerHTML = html;
  const stuck = data ? data.threads.filter(t => t.state === "needs-owner" || t.state === "blocked") : [];
  $("owner-threads").innerHTML = stuck.map(t => `<div class="row"><span class="dot" style="background:${t.state === "blocked" ? "var(--red)" : "var(--amber)"}"></span>
      <div class="body"><span class="title">${esc(t.name)}${t.issue ? ` (#${t.issue})` : ""} ${t.state === "blocked" ? "is blocked" : "needs you"}</span>
      <div class="sub">${esc(t.note)}</div></div><span class="side">${ago(t.updated)}</span></div>`).join("");
  open += pushes.length + stuck.length;
  $("needs-count").textContent = open ? `${open} open` : "nothing open";
}

function renderClocks(){
  $("clocks").innerHTML = CLOCKS.map(c => {
    const l = left(c.at), soon = l && ms(c.at) - Date.now() < 3600e3;
    return `<div class="clock ${l ? (soon ? "soon" : "") : "past"}"><div class="lbl">${c.lbl}</div>
      <div class="left">${l || "passed"}</div><div class="at">${day(c.at)} ${clock(c.at)}</div></div>`;
  }).join("");
  const next = CLOCKS.find(c => left(c.at));
  $("next").textContent = next ? `Next: ${next.lbl} in ${left(next.at)}` : "";
}

function nodeHtml(n, extra = ""){
  if (!n) return "";
  return `<a class="node st-${n.state} ${extra}" href="${esc(n.url || "#")}" target="_blank">
    <div class="t"><b>#${n.number}</b>${esc(shortTitle(n.title))}</div>
    <div class="s"><span class="st">${STATE_LABEL[n.state]}</span>${n.updated ? `, updated ${ago(n.updated)}` : ""}</div>
    ${n.note ? `<div class="n">${esc(n.note)}</div>` : ""}</a>`;
}
function renderMap(){
  if (!data) return;
  const m = data.map;
  $("map").innerHTML = `
    <div class="col hw"><div class="who">Rafael, hardware</div>${HARDWARE.map(n => nodeHtml(m[n])).join("")}</div>
    <div class="wire"></div>
    <div class="col"><div class="who">The contract</div>${nodeHtml(m[HUB], "hub")}</div>
    <div class="wire in"></div>
    <div class="col"><div class="who">Godfrey, software</div>${SOFTWARE.map(n => nodeHtml(m[n])).join("")}</div>`;
}

const KIND = {commit:"commit", comment:"comment", issue:"issue", pr:"PR", thread:"thread", push:"push"};
function eventRow(e, isNew){
  const text = e.url ? `<a href="${esc(e.url)}" target="_blank">${esc(e.text)}</a>` : esc(e.text);
  return `<div class="row k-${e.kind} ${isNew ? "new" : ""}"><span class="dot"></span>
    <div class="body"><span class="tag">${KIND[e.kind] || e.kind}</span>${e.who ? `<b>${esc(e.who)}</b> ` : ""}${text}${isNew ? '<span class="newmark">new</span>' : ""}
    <div class="sub">${day(e.time)} ${clock(e.time)}, ${ago(e.time)}</div></div></div>`;
}
function renderFeed(){
  if (!data) return;
  const feed = data.feed, fresh = feed.filter(e => ms(e.time) > baseline);
  $("feed").innerHTML = feed.slice(0, feedShown).map(e => eventRow(e, ms(e.time) > baseline)).join("") || '<div class="empty">No events yet.</div>';
  $("feed-more").style.display = feed.length > feedShown ? "" : "none";
  $("new-count").textContent = fresh.length ? `${fresh.length} new` : "";
  const needs = $("needs-count").textContent.match(/^\d+/);
  document.title = `${fresh.length ? `(${fresh.length}) ` : ""}${needs ? `${needs[0]} for you, ` : ""}HackUTD status`;
  $("rafael").innerHTML = data.rafael.slice(0, 12).map(e => eventRow(e, false)).join("") || '<div class="empty">Nothing from Rafael yet.</div>';
}

function renderFresh(){
  if (!data) return;
  const age = (Date.now() - ms(data.generated)) / 1000, stale = age > data.interval_s * 3;
  $("fresh").textContent = stale ? `Data is ${ago(data.generated).replace(" ago", "")} old. Is the collector running?` : `Data from ${ago(data.generated)}`;
  $("fresh").className = "meta" + (stale ? " bad" : "");
  $("errors").textContent = data.errors.length ? "Collector errors: " + data.errors.join("; ") : "";
}

function renderAll(){ renderNeeds(); renderClocks(); renderMap(); renderFeed(); renderFresh(); }

async function poll(){
  try {
    const r = await fetch("status.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    renderAll();
  } catch (e) {
    $("fresh").textContent = "Cannot read status.json. Is the collector running?";
    $("fresh").className = "meta bad";
  }
}

function markSeen(){ store.set("lastSeen", Date.now()); }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) markSeen();
  else { baseline = store.get("lastSeen", 0); renderFeed(); }
});
window.addEventListener("pagehide", markSeen);
$("seen").onclick = () => { markSeen(); baseline = Date.now(); renderFeed(); };
$("feed-more").onclick = () => { feedShown += FEED_STEP; renderFeed(); };
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.task;
  if (!id) return;
  const done = store.get("tasks", {});
  done[id] = e.target.checked;
  store.set("tasks", done);
  renderNeeds(); renderFeed();
});
document.addEventListener("click", e => {
  if (!e.target.matches("[data-copy]")) return;
  const text = e.target.parentElement.querySelector("pre").textContent;
  navigator.clipboard.writeText(text).then(() => { e.target.textContent = "Copied"; setTimeout(() => e.target.textContent = "Copy", 1500); }, () => {});
});

renderNeeds(); renderClocks();
poll();
setInterval(poll, 10000);
setInterval(() => { renderClocks(); tickDue(); renderFresh(); }, 1000);
</script>
</body>
</html>
