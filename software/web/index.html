<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAND</title>
  <link rel="icon" href="brand/land-favicon-16.svg" type="image/svg+xml">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; background: #06101f; color: #e8f0fb; }
    h1 { display: flex; align-items: center; gap: 0.75rem; letter-spacing: 0.04em; }
    h1 img { width: 2.5rem; height: 2.5rem; }
    a { display: block; font-size: 1.25rem; margin: 0.75rem 0; color: #4da3ff; }
  </style>
</head>
<body>
  <h1><img src="brand/land-mark-white.svg" alt="LAND"></h1>
  <a id="dashboard" href="/dashboard/">Dashboard: 500 homes, ranked by time to harm</a>
  <a id="home" href="/home/">Home screen: the box</a>
  <script>
    // Carry ?hub=ws://host:port through to the pages so they talk to the same bus.
    const hub = new URLSearchParams(location.search).get("hub");
    if (hub) for (const a of document.querySelectorAll("a")) a.href += "?hub=" + encodeURIComponent(hub);
  </script>
</body>
</html>
